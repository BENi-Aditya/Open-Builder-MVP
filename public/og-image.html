<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OpenBuilder OG Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1200px;
            height: 630px;
            background-color: #FFE500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', 'Inter', sans-serif;
        }
        .logo {
            width: 200px;
            height: 200px;
            margin-bottom: 40px;
        }
        .text {
            font-size: 96px;
            font-weight: 900;
            color: #000000;
            letter-spacing: -2px;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <img src="/logo.webp" alt="OpenBuilder Logo" class="logo">
    <div class="text">BUILD IN PUBLIC</div>
</body>
</html>
